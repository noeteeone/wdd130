    <main>
        <div class="hero1">

            <h1>NOETEE RAFTING Company. Ltd</h1>

                    </div>

                        <input type="email" id="mail" name="user_email" />
                    </div>
                    
                    <!--xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx-->
                    
                    <fieldset>
                        <label for="message purpose" id="message purpose" name="message purpose">

                        <input type="radio" id="general inquiry" name="general enquiry" value="G" />
                        <label for="general inquiry">General Inquiry</label><br />

                        <input type="radio" id="reservation question" name="reservation question" value="R" />
                        <label for="reservation question">Reservation Question</label><br />
                        
                        <input type="radio" id="Website Suggestion" name="Website Suggestion" value="W" />
                        <label for="Website Suggestion">Website Suggestion</label>
                        
                    </fieldset>

                    <!--xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                    <div class="radio-group">
                        <label for="message purpose">Message Purpose:</label>
                        <p>

                        </p>
                    
                        <p>
                            <input type="radio" id="opt2" name="radio" class="small-radio">
                            <label for="opt2">Reservation Question</label>
                        </p>
                    
                        <p>
                            <input type="radio" id="opt3" name="radio" class="small-radio">
                            <label for="opt3">Website Suggestion</label>
                        </p>
                    </div>
                    
                xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx-->

                    </div>
                    
                
                    <div class="button">
                        <button type="submit" id="submit" name="submit">Send your message</button>
                    </div>

                <form>
                    <div id="newsletter">
                        <label for="newsletter">Please Subscribe me to the monthly Newsletter
                        <input type="checkbox" id="newsletter" name="newsletter"></label>
                    </div>
                    <div id="submit">
                        <label for="submit"></label>
