<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form Exercise</title>
    <link rel="stylesheet" href="styles/poll_form.css">
</head>
<body>
    <form>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="+123-456-789-012" required>

        <label for="browser">Select your favorite browser?</label>
        <select name="browser" id="browser">
            <option value="1">Firefox</option>
            <option value="2">Edge</option>
            <option value="3">Google Chrome</option>
        </select>

        <label for="pet">Do you have a household pet?</label>
        <input type="checkbox" id="pet" name="pet">

        <label for="feedback">List the places you have lived</label>
        <textarea id="feedback" name="feedback" rows="5" placeholder="Zimre Harare Zimbabwe, Manyame Harare Zimbabwe, Ibex Lusaka Zambia, Monduli Arusha Tanzania, Soweto Johanesburg South Africa"></textarea> 

        <button type="submit">Submit Contact Information</button>
           
    </form>
</body>
</html>
