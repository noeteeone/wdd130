        <label for="CSS">3.Which of the following is a valid CSS comment?</label>
        <select name="comment" id="comment" placeholder="Choose one">
            <option value="1">Choose One.... </option>
            <option value="2">/* comment </option>
            <option value="3">comment*/</option>
            <option value="4">/*comment*/</option>
            <option value="5">#comment*/</option>
            <option value="6">"""comment"""</option>
        </select>
    
        <label for="margin">4.What is the bottom margin given this declaration</label>
